<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Spotify 연결 중...</title></head>
<body style="background:#191414;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:16px;">
<div id="msg" style="text-align:center;font-size:1.1rem;line-height:1.8;">
  Spotify 연결 중...<br>
  <span style="font-size:0.8rem;opacity:0.6;">잠시만 기다려 주세요.</span>
</div>
<script>
(async function() {
  const CLIENT_ID    = 'a64b0ccd44e244b48b9863a15e1a5a7b';
  const REDIRECT_URI = 'https://onlywayleftis.github.io/Forget_Me_Not/spotify_callback.html';

  const params  = new URLSearchParams(window.location.search);
  const code    = params.get('code');
  const error   = params.get('error');
  // verifier는 state 파라미터로 전달됨
  const verifier = params.get('state');

  if (error) {
    document.getElementById('msg').textContent = '❌ 로그인이 취소됐어요.';
    setTimeout(() => window.close(), 2000);
    return;
  }
  if (!code) {
    document.getElementById('msg').textContent = '❌ 인증 코드를 받지 못했습니다.';
    return;
  }
  if (!verifier) {
    document.getElementById('msg').textContent = '❌ code_verifier 누락. 타이머 창에서 다시 시도해 주세요.';
    return;
  }

  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id:     CLIENT_ID,
        grant_type:    'authorization_code',
        code,
        redirect_uri:  REDIRECT_URI,
        code_verifier: verifier,
      })
    });
    const data = await res.json();

    if (data.access_token) {
      document.getElementById('msg').innerHTML =
        '✅ 연결 성공!<br><span style="font-size:0.8rem;opacity:0.6;">이 창이 자동으로 닫힙니다.</span>';
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type:      'SPOTIFY_TOKEN',
          token:     data.access_token,
          expiresIn: data.expires_in
        }, '*');
      }
      setTimeout(() => window.close(), 1500);
    } else {
      document.getElementById('msg').textContent =
        '❌ 토큰 교환 실패: ' + (data.error_description || JSON.stringify(data));
    }
  } catch(e) {
    document.getElementById('msg').textContent = '❌ 네트워크 오류: ' + e.message;
  }
})();
</script>
</body>
</html>
