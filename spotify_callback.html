<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Spotify 연결 중...</title></head>
<body style="background:#191414;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
<div id="msg" style="text-align:center;font-size:1.1rem;">Spotify 연결 중...</div>
<script>
  // fragment(#)에서 access_token 추출 (Implicit Grant)
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const expiresIn = params.get('expires_in');

  if (token) {
    // 부모 창(포모도로 타이머)에 토큰 전달
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'SPOTIFY_TOKEN', token, expiresIn }, '*');
      document.getElementById('msg').textContent = '✅ 연결 성공! 이 창을 닫아 주세요.';
      setTimeout(() => window.close(), 1500);
    } else {
      document.getElementById('msg').textContent = '⚠️ 부모 창을 찾을 수 없어요. 타이머 창에서 다시 시도해 주세요.';
    }
  } else {
    document.getElementById('msg').textContent = '❌ 토큰을 받지 못했습니다. 다시 시도해 주세요.';
  }
</script>
</body>
</html>
